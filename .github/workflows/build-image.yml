name: Build and publish image

# The app's own server is too small to run `next build` — it gets OOM-killed
# partway through. So the image is built here instead and Coolify only ever
# pulls the finished result, which costs it almost no memory.
#
# Runs on GitHub's amd64 runners, which is also what the VPS is; building on an
# arm64 laptop would need QEMU emulation and take an order of magnitude longer.

on:
  push:
    branches: [main]
    # Docs and local-only compose changes don't alter the image.
    paths-ignore:
      - "**.md"
      - "docker-compose.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # lets GITHUB_TOKEN push to ghcr.io — no PAT needed

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          # :latest is what Coolify pulls; the sha tag gives you something
          # precise to roll back to.
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_TIMEZONE=Asia/Kolkata
          # Layer cache lives with the Action, so only changed layers rebuild.
          cache-from: type=gha
          cache-to: type=gha,mode=max
